<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>钢铁咆哮 KV-44</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0c0e12;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
      }
      canvas {
        border-radius: 4px;
        touch-action: none;
      }
      /* 触屏设备竖屏时提示横屏 */
      #rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0c0e12;
        color: #e8e4d8;
        font: 600 18px system-ui, "PingFang SC", sans-serif;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
      }
      #rotate-hint .icon {
        font-size: 44px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">
      <div class="icon">📱➡️🖥️</div>
      <div>请横屏游玩以获得最佳体验</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
